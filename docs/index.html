<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoraBot — book recommendations</title>
<meta name="description" content="Describe what you want to read. NoraBot finds it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;
  --ink:#000000;
  --mute:#6b6570;
  --orchid:#dda0ee;
  --orchid-deep:#b869d6;
  --orchid-wash:#f7ecfb;
  --line:#e8e2ec;
}

*{box-sizing:border-box;margin:0;padding:0}

html{-webkit-text-size-adjust:100%}

body{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:32px 24px 48px;
}

/* ---------- shared ---------- */

.stage{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  max-width:1080px;
  width:100%;
  margin:0 auto;
}
.stage[hidden]{display:none}

.wordmark{
  font-size:.95rem;
  font-weight:800;
  letter-spacing:-.01em;
  align-self:flex-start;
  max-width:1080px;
  width:100%;
  margin:0 auto 8px;
}
.wordmark button{
  font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
}
.wordmark button:hover{color:var(--orchid-deep)}

/* ---------- view 1 ---------- */

.paths{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px;
  width:100%;
}

.path{
  font:inherit;
  font-size:1.0625rem;
  font-weight:500;
  line-height:1.35;
  color:var(--ink);
  background:var(--orchid);
  border:0;
  border-radius:28px;
  aspect-ratio:1/1;
  padding:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  transition:transform .18s ease, background .18s ease;
}
.path:hover:not(:disabled){background:var(--orchid-deep);transform:translateY(-3px)}
.path:disabled{
  background:var(--orchid-wash);
  color:var(--mute);
  cursor:not-allowed;
}
.path small{
  display:block;
  margin-top:10px;
  font-size:.8125rem;
  font-weight:300;
  color:var(--mute);
}
.path:hover:not(:disabled) small{color:rgba(255,255,255,.85)}

/* ---------- view 2 ---------- */

.ask{text-align:center;width:100%;max-width:760px}

h1{
  font-size:clamp(2.25rem,6vw,4.25rem);
  font-weight:800;
  letter-spacing:-.035em;
  line-height:1.02;
}

.sub{
  margin:28px auto 0;
  max-width:60ch;
  font-size:1.0625rem;
  font-weight:300;
  line-height:1.55;
  color:var(--mute);
}

form{margin-top:44px;display:flex;justify-content:center}

input[type=text]{
  font:inherit;
  font-size:1rem;
  font-weight:300;
  width:min(560px,100%);
  padding:18px 26px;
  border:0;
  border-radius:999px;
  background:var(--orchid);
  color:var(--ink);
}
input[type=text]::placeholder{color:rgba(0,0,0,.42)}
input[type=text]:focus{outline:3px solid var(--orchid-deep);outline-offset:3px}

/* ---------- results ---------- */

.results{
  width:100%;
  max-width:760px;
  margin:56px auto 0;
  text-align:left;
}
.results[hidden]{display:none}

.note{
  font-size:.875rem;
  font-weight:300;
  line-height:1.5;
  color:var(--mute);
  border-left:2px solid var(--orchid);
  padding-left:14px;
  margin-bottom:32px;
}

ol{list-style:none;counter-reset:rank}

li{
  counter-increment:rank;
  display:grid;
  grid-template-columns:2.25rem 1fr;
  gap:16px;
  padding:16px 0;
  border-bottom:1px solid var(--line);
}
li::before{
  content:counter(rank);
  font-size:.875rem;
  font-weight:500;
  color:var(--orchid-deep);
  padding-top:.2rem;
}

.title{font-size:1.0625rem;font-weight:500;line-height:1.3}

.meta{
  margin-top:5px;
  font-size:.8125rem;
  font-weight:300;
  color:var(--mute);
}

.again{
  font:inherit;
  font-size:.9375rem;
  font-weight:500;
  margin-top:32px;
  padding:12px 24px;
  border:0;
  border-radius:999px;
  background:var(--orchid);
  cursor:pointer;
}
.again:hover{background:var(--orchid-deep)}

footer{
  max-width:1080px;
  width:100%;
  margin:48px auto 0;
  font-size:.8125rem;
  font-weight:300;
  color:var(--mute);
}
footer a{color:var(--orchid-deep)}

@media (max-width:720px){
  .paths{grid-template-columns:1fr;gap:16px}
  .path{aspect-ratio:auto;min-height:112px;border-radius:22px}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>

<div class="wordmark"><button type="button" id="home">NoraBot</button></div>

<!-- view 1 -->
<main class="stage" id="view-paths">
  <div class="paths">
    <button class="path" id="go-new">Try as a new user</button>
    <button class="path" disabled>Try as Ivy<small>coming soon</small></button>
    <button class="path" disabled>See what NoraBot would recommend to Steve Jobs or Natalie Portman, and why<small>coming soon</small></button>
  </div>
</main>

<!-- view 2 -->
<main class="stage" id="view-ask" hidden>
  <div class="ask">
    <h1>Describe what you want to read</h1>
    <p class="sub">The more context you give, the better. Names of books you like, what
      you're in the mood for, things you don't like — everything helps.</p>

    <form id="form">
      <label for="q" class="sr-only" hidden>What do you want to read?</label>
      <input type="text" id="q" autocomplete="off"
             placeholder="something feel-good and short">
    </form>

    <section class="results" id="results" hidden>
      <p class="note" id="note"></p>
      <ol id="list"></ol>
      <button class="again" id="again">Search again</button>
    </section>
  </div>
</main>

<footer>
  Built on the UCSD Goodreads dataset (2017 snapshot), for academic use.
  <a href="https://github.com/">Source</a>
</footer>

<script>
const $ = id => document.getElementById(id);
const views = {paths: $("view-paths"), ask: $("view-ask")};

function show(name){
  for (const [k, el] of Object.entries(views)) el.hidden = k !== name;
  if (name === "ask") $("q").focus();
}

$("go-new").addEventListener("click", () => show("ask"));
$("home").addEventListener("click", () => { reset(); show("paths"); });

function reset(){
  $("results").hidden = true;
  $("q").value = "";
  $("list").innerHTML = "";
}

$("again").addEventListener("click", () => { reset(); $("q").focus(); });

let works = null;

async function load(){
  if (works) return works;
  const res = await fetch("data/popular.json");
  if (!res.ok) throw new Error("data unavailable");
  works = (await res.json()).works;
  return works;
}

function fmt(n){ return n.toLocaleString("en-US"); }

function render(items){
  $("list").innerHTML = items.map(b => {
    const bits = [];
    if (b.year)   bits.push(b.year);
    if (b.pages)  bits.push(b.pages + " pages");
    if (b.rating) bits.push(b.rating + "★ from " + fmt(b.ratings) + " ratings");
    return `<li><div>
      <div class="title">${b.title}</div>
      <div class="meta">${bits.join(" · ")}</div>
    </div></li>`;
  }).join("");
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;

  $("results").hidden = false;
  $("note").textContent = "Loading…";
  $("list").innerHTML = "";

  try {
    const all = await load();
    $("note").textContent =
      "This is the popularity baseline — the ten most-read books in the " +
      "training set. It doesn't read your query yet. Retrieval that responds " +
      "to what you typed is the next thing being built.";
    render(all.slice(0, 10));
  } catch (err) {
    $("note").textContent = "Couldn't load the catalog. Try reloading the page.";
  }
});
</script>
</body>
</html>
