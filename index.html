<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoraBot — find your next read</title>
<meta name="description" content="Describe what you want to read. NoraBot finds it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --periwinkle:#a2ade0;
  --periwinkle-lit:#bcc5ec;
  --ink:#14141c;
  --pale:#e9e9f2;
  --mute:#9a9ab0;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

body{
  font-family:Poppins,system-ui,sans-serif;
  color:var(--pale);
  min-height:100vh;
  padding:40px 32px 56px;
  display:flex;
  flex-direction:column;
  background:linear-gradient(100deg,#000 0%,#111 22%,#4b4b52 62%,#d8d8e0 88%,#fff 100%);
  background-attachment:fixed;
}

.stage{
  flex:1;
  width:100%;
  max-width:1180px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.stage[hidden]{display:none}

/* ---------- title pill ---------- */

.title{
  background:var(--periwinkle);
  color:var(--ink);
  font-size:clamp(1.5rem,3.6vw,2.6rem);
  font-weight:500;
  letter-spacing:-.015em;
  padding:22px 56px;
  border-radius:26px;
  margin-bottom:56px;
  text-align:center;
}
.title button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- three paths ---------- */

.paths{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:80px;
  width:100%;
}

.path{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:26px;
  background:none;
  border:0;
  padding:0;
  font:inherit;
  cursor:pointer;
}

.path img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  transition:transform .2s ease, box-shadow .2s ease;
}

.path .label{
  background:var(--periwinkle);
  color:var(--ink);
  font-size:1rem;
  font-weight:400;
  line-height:1.35;
  text-align:center;
  padding:18px 28px;
  border-radius:999px;
  width:100%;
  transition:background .2s ease;
}

.path:hover:not(:disabled) img{transform:translateY(-6px);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.path:hover:not(:disabled) .label{background:var(--periwinkle-lit)}
.path:focus-visible{outline:3px solid var(--periwinkle-lit);outline-offset:8px}

/* ---------- ask view ---------- */

.ask{text-align:center;max-width:760px;width:100%}

h1{
  font-size:clamp(2rem,5.4vw,3.6rem);
  font-weight:600;
  letter-spacing:-.03em;
  line-height:1.06;
}

.sub{
  margin:26px auto 0;
  max-width:58ch;
  font-size:1rem;
  font-weight:300;
  line-height:1.6;
  color:#c3c3d2;
}

form{margin-top:42px;display:flex;justify-content:center}

input[type=text]{
  font:inherit;
  font-size:1rem;
  font-weight:300;
  width:min(560px,100%);
  padding:18px 28px;
  border:0;
  border-radius:999px;
  background:var(--periwinkle);
  color:var(--ink);
}
input[type=text]::placeholder{color:rgba(20,20,28,.5)}
input[type=text]:focus{outline:3px solid var(--periwinkle-lit);outline-offset:3px}

/* ---------- results ---------- */

.results{width:100%;max-width:700px;margin:52px auto 0;text-align:left}
.results[hidden]{display:none}

.note{
  font-size:.875rem;
  font-weight:300;
  line-height:1.55;
  color:#b9b9cb;
  border-left:2px solid var(--periwinkle);
  padding-left:14px;
  margin-bottom:28px;
}

ol{list-style:none;counter-reset:rank}

li{
  counter-increment:rank;
  display:grid;
  grid-template-columns:2rem 1fr;
  gap:14px;
  padding:15px 0;
  border-bottom:1px solid rgba(162,173,224,.22);
}
li::before{
  content:counter(rank);
  font-size:.875rem;
  font-weight:500;
  color:var(--periwinkle);
  padding-top:.15rem;
}

.bt{font-size:1.0625rem;font-weight:400;line-height:1.3}
.bm{margin-top:4px;font-size:.8125rem;font-weight:300;color:var(--mute)}

.again{
  font:inherit;
  font-size:.9375rem;
  font-weight:400;
  margin-top:30px;
  padding:13px 28px;
  border:0;
  border-radius:999px;
  background:var(--periwinkle);
  color:var(--ink);
  cursor:pointer;
}
.again:hover{background:var(--periwinkle-lit)}

footer{
  width:100%;
  max-width:1180px;
  margin:52px auto 0;
  font-size:.8125rem;
  font-weight:300;
  color:#8f8fa6;
}
footer a{color:var(--periwinkle)}

@media (max-width:860px){
  .paths{grid-template-columns:1fr;gap:34px;max-width:420px}
  .title{margin-bottom:40px;padding:18px 34px}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- view 1 -->
<main class="stage" id="view-paths">
  <div class="title">NoraBot: Find your Next Read</div>

  <div class="paths">
    <button class="path" id="go-new">
      <img src="images/new-user.jpg" alt="">
      <span class="label">Try as a new user</span>
    </button>

    <button class="path" disabled>
      <img src="images/ivy.jpg" alt="">
      <span class="label">Try as Ivy</span>
    </button>

    <button class="path" disabled>
      <img src="images/jobs.jpg" alt="">
      <span class="label">See which books NoraBot recommends to Steve Jobs</span>
    </button>
  </div>
</main>

<!-- view 2 -->
<main class="stage" id="view-ask" hidden>
  <div class="title"><button type="button" id="home">NoraBot</button></div>

  <div class="ask">
    <h1>Describe what you want to read</h1>
    <p class="sub">The more context you give, the better. Names of books you like, what
      you're in the mood for, things you don't like — everything helps.</p>

    <form id="form">
      <input type="text" id="q" autocomplete="off"
             aria-label="What do you want to read?"
             placeholder="something feel-good and short">
    </form>

    <section class="results" id="results" hidden>
      <p class="note" id="note"></p>
      <ol id="list"></ol>
      <button class="again" id="again">Search again</button>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const views = {paths: $("view-paths"), ask: $("view-ask")};

function show(name){
  for (const [k, el] of Object.entries(views)) el.hidden = k !== name;
  if (name === "ask") $("q").focus();
}

function reset(){
  $("results").hidden = true;
  $("q").value = "";
  $("list").innerHTML = "";
}

$("go-new").addEventListener("click", () => show("ask"));
$("home").addEventListener("click", () => { reset(); show("paths"); });
$("again").addEventListener("click", () => { reset(); $("q").focus(); });

let works = null;

async function load(){
  if (works) return works;
  const res = await fetch("data/popular.json");
  if (!res.ok) throw new Error("data unavailable");
  works = (await res.json()).works;
  return works;
}

const fmt = n => n.toLocaleString("en-US");

function render(items){
  $("list").innerHTML = items.map(b => {
    const bits = [];
    if (b.year)   bits.push(b.year);
    if (b.pages)  bits.push(b.pages + " pages");
    if (b.rating) bits.push(b.rating + "\u2605 from " + fmt(b.ratings) + " ratings");
    return '<li><div><div class="bt">' + b.title +
           '</div><div class="bm">' + bits.join(" \u00b7 ") + '</div></div></li>';
  }).join("");
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (!$("q").value.trim()) return;

  $("results").hidden = false;
  $("note").textContent = "Loading\u2026";
  $("list").innerHTML = "";

  try {
    const all = await load();
        $("note").textContent = "";
    render(all.slice(0, 10));
  } catch (err) {
    $("note").textContent = "Couldn't load the catalog. Try reloading the page.";
  }
});
</script>
</body>
</html>
